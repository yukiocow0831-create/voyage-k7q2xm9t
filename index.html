<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#2563eb">
<meta name="format-detection" content="telephone=no">
<meta property="og:type" content="website">
<meta property="og:title" content="VOYAGE — スマート旅行プランナー">
<meta property="og:description" content="目的地・交通・宿・観光を選ぶだけで「旅のしおり」が完成！友だちと一緒に旅行計画を立てましょう。">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232563eb'/%3E%3Ctext x='50' y='72' font-size='62' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EV%3C/text%3E%3C/svg%3E">
<title>VOYAGE — スマート旅行プランナー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f7fb;
  --surface: #ffffff;
  --surface-glass: rgba(255, 255, 255, 0.86);
  --surface-muted: #f8fafc;
  --text: #0f172a;
  --text-sub: #475569;
  --text-muted: #94a3b8;
  --primary: #0ea5e9;
  --primary-dark: #0284c7;
  --primary-light: #e0f2fe;
  --accent: #6366f1;
  --accent-light: #e0e7ff;
  --emerald: #10b981;
  --emerald-light: #d1fae5;
  --amber: #f59e0b;
  --amber-light: #fef3c7;
  --rose: #f43f5e;
  --rose-light: #ffe4e6;
  --border: #e2e8f0;
  --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
  --shadow-md: 0 10px 30px -5px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 20px 40px -12px rgba(14, 165, 233, 0.18);
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 24px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  background-image:
    radial-gradient(at 0% 0%, rgba(14, 165, 233, 0.10) 0px, transparent 50%),
    radial-gradient(at 100% 0%, rgba(99, 102, 241, 0.10) 0px, transparent 50%);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  padding-bottom: 60px;
}

/* Header & Hero */
.app-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(226, 232, 240, 0.8);
  padding: 12px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-logo {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-family: 'Outfit', sans-serif;
  font-weight: 800;
  font-size: 20px;
  box-shadow: 0 6px 16px rgba(14, 165, 233, 0.3);
}

.brand-title {
  font-family: 'Outfit', sans-serif;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: 0.04em;
  background: linear-gradient(135deg, #0f172a 0%, #0284c7 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.brand-sub {
  font-size: 11px;
  color: var(--text-sub);
  display: block;
  margin-top: -4px;
}

/* Stepper Navigation */
.stepper {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface-muted);
  padding: 5px;
  border-radius: 999px;
  border: 1px solid var(--border);
}

.step-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  border-radius: 999px;
  border: none;
  background: transparent;
  color: var(--text-sub);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.22s ease;
}

.step-btn:hover {
  color: var(--text);
  background: rgba(255, 255, 255, 0.6);
}

.step-btn.active {
  background: linear-gradient(135deg, #0ea5e9 0%, #4f46e5 100%);
  color: #fff;
  box-shadow: 0 4px 12px rgba(14, 165, 233, 0.28);
}

.step-btn.completed:not(.active) {
  color: var(--primary-dark);
  background: var(--primary-light);
}

.step-num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: 'Outfit', sans-serif;
  font-size: 12px;
  font-weight: 700;
  background: rgba(15, 23, 42, 0.08);
}

.step-btn.active .step-num {
  background: rgba(255, 255, 255, 0.25);
  color: #fff;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.btn-outline {
  padding: 8px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s;
}

.btn-outline:hover {
  border-color: var(--primary);
  color: var(--primary-dark);
  background: var(--primary-light);
}

.btn-primary {
  padding: 10px 20px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg, #0ea5e9 0%, #4f46e5 100%);
  color: #fff;
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 6px 18px rgba(14, 165, 233, 0.28);
  transition: transform 0.18s ease, box-shadow 0.18s ease;
}

.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 10px 24px rgba(14, 165, 233, 0.38);
}

/* Main Layout */
.layout {
  max-width: 1380px;
  margin: 24px auto 0;
  padding: 0 24px;
  display: grid;
  grid-template-columns: 1fr 360px;
  gap: 24px;
  align-items: start;
}

/* Trip Config Bar */
.trip-config-bar {
  background: var(--surface);
  border-radius: var(--radius-md);
  padding: 16px 20px;
  margin-bottom: 22px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 14px;
}

.config-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.config-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-sub);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  display: flex;
  align-items: center;
  gap: 5px;
}

.config-input, .config-select {
  width: 100%;
  padding: 9px 12px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface-muted);
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s, background 0.2s;
}

.config-input:focus, .config-select:focus {
  border-color: var(--primary);
  background: #fff;
}

/* Step Section Header */
.section-banner {
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #0369a1 100%);
  color: #fff;
  padding: 24px 28px;
  border-radius: var(--radius-lg);
  margin-bottom: 22px;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  box-shadow: var(--shadow-md);
}

.section-banner::after {
  content: '';
  position: absolute;
  right: -40px;
  top: -40px;
  width: 220px;
  height: 220px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(14, 165, 233, 0.35) 0%, transparent 70%);
  pointer-events: none;
}

.section-banner h2 {
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.section-banner p {
  font-size: 13.5px;
  color: #cbd5e1;
}

/* Filter Pills & Search */
.filter-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
}

.pill-group {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.pill {
  padding: 7px 15px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-sub);
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.18s;
}

.pill:hover {
  border-color: var(--primary);
  color: var(--primary-dark);
}

.pill.active {
  background: var(--text);
  color: #fff;
  border-color: var(--text);
}

.search-box {
  position: relative;
  min-width: 240px;
}

.search-box input {
  width: 100%;
  padding: 9px 14px 9px 36px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  font-family: inherit;
  font-size: 13px;
  outline: none;
}

.search-box input:focus {
  border-color: var(--primary);
}

.search-box .search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 14px;
}

/* Destination Grid */
.dest-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 18px;
}

.dest-card {
  background: var(--surface);
  border-radius: var(--radius-md);
  overflow: hidden;
  border: 2px solid transparent;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  flex-direction: column;
  position: relative;
}

.dest-card:hover {
  transform: translateY(-5px);
  box-shadow: var(--shadow-md);
}

.dest-card.selected {
  border-color: var(--primary);
  box-shadow: var(--shadow-lg);
}

.dest-visual {
  height: 165px;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: flex-end;
  padding: 14px;
  color: #fff;
}

.dest-visual-bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  transition: transform 0.45s ease;
}

.dest-card:hover .dest-visual-bg {
  transform: scale(1.06);
}

.dest-visual-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(15, 23, 42, 0.82) 0%, rgba(15, 23, 42, 0.15) 65%, transparent 100%);
}

.dest-region-badge {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 2;
  background: rgba(15, 23, 42, 0.68);
  backdrop-filter: blur(8px);
  color: #fff;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
}

.dest-selected-check {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 2;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--primary);
  color: #fff;
  display: none;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
}

.dest-card.selected .dest-selected-check {
  display: flex;
}

.dest-title-wrap {
  position: relative;
  z-index: 2;
  width: 100%;
}

.dest-name {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: 0.02em;
  display: flex;
  align-items: center;
  gap: 6px;
}

.dest-catch {
  font-size: 12px;
  color: rgba(255, 255, 255, 0.88);
}

.dest-body {
  padding: 14px 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 1;
}

.dest-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.tag {
  font-size: 11px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 6px;
  background: var(--surface-muted);
  color: var(--text-sub);
}

.dest-meta {
  margin-top: auto;
  padding-top: 10px;
  border-top: 1px dashed var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text-sub);
}

.dest-meta strong {
  color: var(--primary-dark);
  font-size: 14px;
}

/* Option Cards (Transport & Hotel & Sightseeing) */
.options-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
  gap: 16px;
}

.option-card {
  background: var(--surface);
  border-radius: var(--radius-md);
  border: 2px solid var(--border);
  padding: 18px;
  cursor: pointer;
  transition: all 0.22s ease;
  display: flex;
  flex-direction: column;
  gap: 12px;
  position: relative;
}

.option-card:hover {
  border-color: #93c5fd;
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
}

.option-card.selected {
  border-color: var(--primary);
  background: linear-gradient(180deg, rgba(224, 242, 254, 0.35) 0%, #ffffff 100%);
  box-shadow: var(--shadow-lg);
}

.option-badge {
  position: absolute;
  top: -11px;
  right: 16px;
  padding: 3px 11px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, #0ea5e9, #6366f1);
  box-shadow: 0 3px 8px rgba(14, 165, 233, 0.3);
}

.option-badge.fast { background: linear-gradient(135deg, #f59e0b, #ef4444); }
.option-badge.cheap { background: linear-gradient(135deg, #10b981, #059669); }

.option-head {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.option-icon {
  width: 46px;
  height: 46px;
  border-radius: 13px;
  background: var(--primary-light);
  color: var(--primary-dark);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}

.option-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
}

.option-sub {
  font-size: 12.5px;
  color: var(--text-sub);
  margin-top: 2px;
}

.option-specs {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  background: var(--surface-muted);
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 12px;
}

.spec-item {
  display: flex;
  flex-direction: column;
}

.spec-label {
  font-size: 10.5px;
  color: var(--text-muted);
}

.spec-val {
  font-weight: 700;
  color: var(--text);
}

.option-foot {
  margin-top: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 8px;
  border-top: 1px solid var(--border);
}

.price-tag {
  font-family: 'Outfit', 'Noto Sans JP', sans-serif;
  font-size: 20px;
  font-weight: 800;
  color: var(--primary-dark);
}

.price-unit {
  font-size: 11.5px;
  font-weight: 500;
  color: var(--text-sub);
}

.select-indicator {
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  background: var(--surface-muted);
  color: var(--text-sub);
  transition: all 0.2s;
}

.option-card.selected .select-indicator {
  background: var(--primary);
  color: #fff;
}

/* Sub-section title */
.sub-heading {
  font-size: 16px;
  font-weight: 800;
  margin: 24px 0 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text);
}

/* Model Course Banner Cards */
.course-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 14px;
  margin-bottom: 24px;
}

.course-card {
  background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
  border: 2px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px;
  cursor: pointer;
  transition: all 0.2s;
}

.course-card:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
}

.course-card.active {
  border-color: var(--accent);
  background: linear-gradient(135deg, rgba(224, 231, 255, 0.45) 0%, #ffffff 100%);
}

/* Spot Cards */
.spot-card {
  background: var(--surface);
  border-radius: var(--radius-md);
  border: 2px solid var(--border);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: all 0.2s;
}

.spot-card.selected {
  border-color: var(--emerald);
  background: linear-gradient(180deg, rgba(209, 250, 229, 0.3) 0%, #ffffff 100%);
}

.day-selector {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.day-chip {
  padding: 4px 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface-muted);
  font-size: 11.5px;
  font-weight: 700;
  cursor: pointer;
  color: var(--text-sub);
}

.day-chip.active {
  background: var(--emerald);
  color: #fff;
  border-color: var(--emerald);
}

/* Right Sidebar Summary */
.summary-sidebar {
  position: sticky;
  top: 80px;
  background: var(--surface);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-md);
  overflow: hidden;
}

.summary-header {
  background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
  color: #fff;
  padding: 18px 20px;
}

.summary-header h3 {
  font-size: 16px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.summary-dest-preview {
  margin-top: 8px;
  font-size: 20px;
  font-weight: 800;
  color: #38bdf8;
  display: flex;
  align-items: center;
  gap: 8px;
}

.summary-body {
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.summary-block {
  padding-bottom: 12px;
  border-bottom: 1px dashed var(--border);
}

.summary-block-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
}

.summary-item-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  font-size: 13px;
}

.summary-item-name {
  font-weight: 600;
  color: var(--text);
}

.summary-item-price {
  font-family: 'Outfit', sans-serif;
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
}

.summary-total-box {
  background: linear-gradient(135deg, #f0f9ff 0%, #e0e7ff 100%);
  border-radius: 14px;
  padding: 14px 16px;
  border: 1px solid #bae6fd;
}

.total-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}

.total-amount {
  font-family: 'Outfit', sans-serif;
  font-size: 26px;
  font-weight: 800;
  color: var(--primary-dark);
}

.per-person-row {
  font-size: 12px;
  color: var(--text-sub);
  display: flex;
  justify-content: space-between;
  margin-top: 4px;
}

/* Timeline / Itinerary View */
.timeline-day {
  background: var(--surface);
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: var(--shadow-sm);
}

.timeline-day-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 2px solid var(--primary-light);
}

.day-badge {
  background: linear-gradient(135deg, #0ea5e9, #4f46e5);
  color: #fff;
  font-family: 'Outfit', sans-serif;
  font-weight: 800;
  padding: 5px 14px;
  border-radius: 999px;
  font-size: 13px;
}

.timeline-list {
  position: relative;
  padding-left: 26px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.timeline-list::before {
  content: '';
  position: absolute;
  left: 9px;
  top: 8px;
  bottom: 8px;
  width: 2px;
  background: #cbd5e1;
}

.timeline-node {
  position: relative;
  background: var(--surface-muted);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.timeline-node::before {
  content: '';
  position: absolute;
  left: -22px;
  top: 50%;
  transform: translateY(-50%);
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--primary);
  border: 2px solid #fff;
  box-shadow: 0 0 0 2px var(--primary-light);
}

.step-nav-footer {
  margin-top: 28px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 18px;
  border-top: 1px solid var(--border);
}

/* Custom Form Box */
.custom-add-box {
  background: var(--surface);
  border: 1px dashed #94a3b8;
  border-radius: var(--radius-md);
  padding: 16px;
  margin-top: 18px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}

/* Toast Notification */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: #0f172a;
  color: #fff;
  padding: 12px 20px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: var(--shadow-lg);
  opacity: 0;
  transform: translateY(12px);
  pointer-events: none;
  transition: all 0.25s ease;
  z-index: 999;
}

.toast.show {
  opacity: 1;
  transform: translateY(0);
}

/* Modal for Saved Plans */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.55);
  backdrop-filter: blur(4px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 500;
  padding: 20px;
}

.modal-backdrop.open {
  display: flex;
}

.modal-card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  max-width: 600px;
  width: 100%;
  padding: 24px;
  box-shadow: var(--shadow-lg);
  max-height: 85vh;
  overflow-y: auto;
}

@media (max-width: 1024px) {
  .layout {
    grid-template-columns: 1fr;
  }
  .summary-sidebar {
    position: static;
  }
  .trip-config-bar {
    grid-template-columns: repeat(2, 1fr);
  }
  .app-header {
    flex-wrap: wrap;
  }
}


/* ===== スマホ・LINEアプリ内ブラウザ対応 ===== */
html,body{max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;}
img{max-width:100%;height:auto;}
@media (max-width: 640px) {
  .app-header{padding-left:12px;padding-right:12px;gap:10px;}
  .stepper{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap;}
  .step-btn{white-space:nowrap;flex:0 0 auto;}
  .layout{padding-left:12px;padding-right:12px;}
  .trip-config-bar{grid-template-columns:1fr;}
  .config-select,.config-input{font-size:16px;min-width:0;width:100%;}
  .step-nav-footer{flex-wrap:wrap;}
  .step-nav-footer > button{flex:1 1 100%;justify-content:center;}
  .modal-card{padding:16px;}
  .modal-card [style*="justify-content:space-between"]{flex-wrap:wrap;}
}

@media print {
  .app-header, .trip-config-bar, .step-nav-footer, .header-actions, .custom-add-box {
    display: none !important;
  }
  .layout {
    grid-template-columns: 1fr;
  }
  body {
    background: #fff;
  }
}

// ==========================================
// Application State
// ==========================================
let state = {
  currentStep: 1,
  regionFilter: 'すべて',
  tagFilter: 'すべて',
  searchQuery: '',
  origin: '東京',
  departDate: '',
  nights: 2,
  adults: 2,
  style: 'standard',
  selectedDestId: 'kyoto',
  selectedTransportId: 'kyoto-shinkansen-nozomi',
  selectedLocalTransportId: 'kyoto-local-subway',
  selectedHotelId: 'kyoto-hotel-boutique',
  selectedCourseId: 'kyoto-course-classic',
  selectedSpots: [] // Array of spot objects with day assignment
};

// Initialize default date (next Saturday)
function initDefaultDate() {
  const d = new Date();
  d.setDate(d.getDate() + 14);
  state.departDate = d.toISOString().split('T')[0];
  document.getElementById('departDate').value = state.departDate;
}

function getCurrentDest() {
  return DESTINATIONS.find(d => d.id === state.selectedDestId) || DESTINATIONS[0];
}

// ==========================================
// Destination Selection & Reset Defaults
// ==========================================
function selectDestination(destId, moveNext = false) {
  state.selectedDestId = destId;
  const dest = getCurrentDest();
  state.selectedTransportId = dest.transports[0].id;
  state.selectedLocalTransportId = dest.localTransports[0].id;
  state.selectedHotelId = dest.hotels[0].id;
  state.selectedCourseId = dest.courses[0].id;
  // Clone default spots
  state.selectedSpots = dest.spots.map(s => ({ ...s }));
  updateSummary();
  if (moveNext) {
    goToStep(2);
    showToast(`📍 「${dest.name}」を選択しました！交通手段を選びましょう`);
  } else {
    renderStep();
  }
}

function onConfigChange() {
  state.origin = document.getElementById('originSelect').value;
  state.departDate = document.getElementById('departDate').value;
  state.nights = parseInt(document.getElementById('nightsSelect').value, 10);
  state.adults = parseInt(document.getElementById('adultsSelect').value, 10);
  state.style = document.getElementById('styleSelect').value;
  updateSummary();
  renderStep();
}

function goToStep(step) {
  state.currentStep = step;
  const btns = document.querySelectorAll('#stepperNav .step-btn');
  btns.forEach((btn, idx) => {
    const s = idx + 1;
    btn.classList.toggle('active', s === step);
    btn.classList.toggle('completed', s < step);
  });
  renderStep();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ==========================================
// Step Rendering
// ==========================================
function renderStep() {
  const container = document.getElementById('stepContent');
  const dest = getCurrentDest();

  if (state.currentStep === 1) {
    renderStep1Destinations(container);
  } else if (state.currentStep === 2) {
    renderStep2Transport(container, dest);
  } else if (state.currentStep === 3) {
    renderStep3Hotel(container, dest);
  } else if (state.currentStep === 4) {
    renderStep4Sightseeing(container, dest);
  } else if (state.currentStep === 5) {
    renderStep5Itinerary(container, dest);
  }
}

  const dest = getCurrentDest();
  const course = dest.courses.find(c => c.id === courseId);
  if (!course) return;
  state.selectedCourseId = courseId;
  const totalDays = Math.max(1, state.nights + 1);
  state.selectedSpots = dest.spots
    .filter(s => course.spotIds.includes(s.id))
    .map(s => ({ ...s, day: Math.min(s.day, totalDays) }));
  updateSummary();
  renderStep();
  showToast(`✨ 「${course.name}」を適用しました`);
}

function toggleSpot(spotId) {
  const dest = getCurrentDest();
  const idx = state.selectedSpots.findIndex(s => s.id === spotId);
  if (idx >= 0) {
    state.selectedSpots.splice(idx, 1);
  } else {
    const sp = dest.spots.find(s => s.id === spotId);
    if (sp) {
      const totalDays = Math.max(1, state.nights + 1);
      state.selectedSpots.push({ ...sp, day: Math.min(sp.day, totalDays) });
    }
  }
  updateSummary();
  renderStep();
}

function assignSpotToDay(spotId, dayNum) {
  const dest = getCurrentDest();
  const existing = state.selectedSpots.find(s => s.id === spotId);
  if (existing) {
    existing.day = dayNum;
  } else {
    const sp = dest.spots.find(s => s.id === spotId);
    if (sp) state.selectedSpots.push({ ...sp, day: dayNum });
  }
  updateSummary();
  renderStep();
}

function addCustomSpot() {
  const name = document.getElementById('newSpotName').value.trim();
  const time = document.getElementById('newSpotTime').value || '13:00';

    return;

  const dest = getCurrentDest();
  const newSp = {
    id: 'custom-' + Date.now(),

    time,

    duration: '60分',

  state.selectedSpots.push({ ...newSp });

}

// STEP 5: Final Itinerary & Budget Breakdown
function renderStep5Itinerary(container, dest) {
  const totalDays = Math.max(1, state.nights + 1);
  const transport = dest.transports.find(t => t.id === state.selectedTransportId) || dest.transports[0];
  const localTrans = dest.localTransports.find(lt => lt.id === state.selectedLocalTransportId) || dest.localTransports[0];
  const hotel = dest.hotels.find(h => h.id === state.selectedHotelId) || dest.hotels[0];

  let daysHtml = '';
  for (let d = 1; d <= totalDays; d++) {
    const daySpots = state.selectedSpots
      .filter(s => (s.day || 1) === d)
      .sort((a, b) => (a.time || '12:00').localeCompare(b.time || '12:00'));

    let dateLabel = `Day ${d}`;
    if (state.departDate) {
      const dt = new Date(state.departDate);
      dt.setDate(dt.getDate() + (d - 1));
      dateLabel = `Day ${d} （${dt.getMonth() + 1}/${dt.getDate()}）`;
    }

    daysHtml += `
      <div class="timeline-day">
        <div class="timeline-day-header">
          <span class="day-badge">${dateLabel}</span>
          <span style="font-size:12.5px;color:var(--text-sub);font-weight:600;">
            ${d === 1 ? `出発：${state.origin} → ${dest.name}` : d === totalDays ? `最終日：${dest.name} → ${state.origin}` : `${dest.name} 終日観光`}
          </span>
        </div>
        <div class="timeline-list">
          ${d === 1 ? `
            <div class="timeline-node">
              <div>
                <div style="font-size:11.5px;color:var(--primary-dark);font-weight:700;">08:30 出発・移動</div>
                <div style="font-weight:700;">${transport.icon} ${transport.name}（${state.origin}発）</div>
                <div style="font-size:12px;color:var(--text-sub);">所要時間：${transport.duration} ／ 現地移動：${localTrans.name}</div>
              </div>
              <span class="tag">移動</span>
            </div>
          ` : ''}

          ${daySpots.length > 0 ? daySpots.map(sp => `
            <div class="timeline-node">
              <div>
                <div style="font-size:11.5px;color:var(--emerald);font-weight:700;">${sp.time || '13:00'} （目安 ${sp.duration}）</div>
                <div style="font-weight:700;">📍 ${sp.name}</div>
                <div style="font-size:12px;color:var(--text-sub);">${sp.desc}</div>
              </div>
              <div style="text-align:right;">
                <span class="tag">${sp.category}</span>
                <div style="font-size:12.5px;font-weight:700;margin-top:4px;">${sp.price === 0 ? '無料' : '¥' + sp.price.toLocaleString()}</div>
              </div>
            </div>
          `).join('') : `
            <div class="timeline-node">
              <div style="color:var(--text-sub);font-size:13px;">自由行動・ゆったり滞在（Step 4で観光スポットを追加できます）</div>
            </div>
          `}

          ${d <= state.nights ? `
            <div class="timeline-node" style="background:var(--primary-light);border-color:#bae6fd;">
              <div>
                <div style="font-size:11.5px;color:var(--primary-dark);font-weight:700;">17:30 チェックイン・ご宿泊</div>
                <div style="font-weight:700;">${hotel.icon} ${hotel.name}</div>
                <div style="font-size:12px;color:var(--text-sub);">${hotel.meal} ｜ ${hotel.area}</div>
              </div>
              <span class="tag" style="background:#fff;">宿泊</span>
            </div>
          ` : `
            <div class="timeline-node">
              <div>
                <div style="font-size:11.5px;color:var(--primary-dark);font-weight:700;">18:00 帰路</div>
                <div style="font-weight:700;">${transport.icon} ${dest.name} 出発 → ${state.origin} 帰着</div>
              </div>
              <span class="tag">帰着</span>
            </div>
          `}
        </div>
      </div>
    `;
  }

  container.innerHTML = `
    <div class="section-banner">
      <div>
        <h2>📖 Step 5. 完成した「旅のしおり」＆ 行程表</h2>
        <p>${dest.emoji} ${dest.name}（${state.nights === 0 ? '日帰り' : state.nights + '泊' + (state.nights + 1) + '日'}・大人${state.adults}名）のオリジナル旅行プランです。</p>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn-outline" style="background:rgba(255,255,255,0.15);color:#fff;border-color:rgba(255,255,255,0.3);" onclick="copyShareText()">📋 LINE・メール用にコピー</button>
        <button class="btn-primary" onclick="window.print()">🖨️ PDF・印刷する</button>
      </div>
    </div>

    ${daysHtml}

    <div class="step-nav-footer">
      <button class="btn-outline" onclick="goToStep(4)">← 観光プランの編集へ戻る</button>
      <button class="btn-primary" onclick="saveCurrentPlan()">💾 このプランを保存する</button>
    </div>
  `;
}

// ==========================================
// Live Summary & Budget Calculation
// ==========================================
function updateSummary() {
  const dest = getCurrentDest();
  const transport = dest.transports.find(t => t.id === state.selectedTransportId) || dest.transports[0];
  const localTrans = dest.localTransports.find(lt => lt.id === state.selectedLocalTransportId) || dest.localTransports[0];
  const hotel = dest.hotels.find(h => h.id === state.selectedHotelId) || dest.hotels[0];

  const nightsLabel = state.nights === 0 ? '日帰り' : `${state.nights}泊${state.nights + 1}日`;
  document.getElementById('summaryDaysBadge').textContent = nightsLabel;
  document.getElementById('summaryDestName').textContent = `${dest.emoji} ${dest.name}`;
  document.getElementById('summaryRouteText').textContent = `${state.origin}発 ・ 大人${state.adults}名 ・ ${state.departDate || '日程未定'}`;

  const transPerPerson = transport ? transport.price : 0;
  const localPerPerson = localTrans ? localTrans.price : 0;
  const hotelPerPerson = hotel ? hotel.pricePerNight * state.nights : 0;
  const spotsPerPerson = state.selectedSpots.reduce((acc, s) => acc + (s.price || 0), 0);

  const perPersonTotal = transPerPerson + localPerPerson + hotelPerPerson + spotsPerPerson;
  const grandTotal = perPersonTotal * state.adults;

  document.getElementById('sumTransportName').textContent = transport ? `${transport.icon} ${transport.name}` : '未選択';
  document.getElementById('sumTransportPrice').textContent = `¥${(transPerPerson * state.adults).toLocaleString()}`;

  document.getElementById('sumLocalTransportName').textContent = localTrans ? `現地: ${localTrans.name}` : '';
  document.getElementById('sumLocalTransportPrice').textContent = `¥${(localPerPerson * state.adults).toLocaleString()}`;

  if (state.nights === 0) {
    document.getElementById('sumHotelName').textContent = '日帰り（宿泊なし）';
    document.getElementById('sumHotelPrice').textContent = '¥0';
    document.getElementById('sumHotelSub').textContent = '';
  } else {
    document.getElementById('sumHotelName').textContent = hotel ? `${hotel.icon} ${hotel.name}` : '未選択';
    document.getElementById('sumHotelPrice').textContent = `¥${(hotelPerPerson * state.adults).toLocaleString()}`;
    document.getElementById('sumHotelSub').textContent = `¥${hotel.pricePerNight.toLocaleString()} × ${state.nights}泊 × ${state.adults}名`;
  }

  const spotsContainer = document.getElementById('sumSpotsList');
  if (state.selectedSpots.length === 0) {
    spotsContainer.innerHTML = `<div style="font-size:12px;color:var(--text-muted);">スポット未選択</div>`;
  } else {
    spotsContainer.innerHTML = state.selectedSpots.map(s => `
      <div class="summary-item-row" style="font-size:12px;">
        <span style="color:var(--text-sub);">[Day${s.day || 1}] ${s.name}</span>
        <span style="font-weight:600;">¥${((s.price || 0) * state.adults).toLocaleString()}</span>
      </div>
    `).join('');
  }

  document.getElementById('sumTotalAmount').textContent = `¥${grandTotal.toLocaleString()}`;
  document.getElementById('sumPerPersonAmount').textContent = `¥${perPersonTotal.toLocaleString()} / 人`;
}

// ==========================================
// Save / Load / Share Helpers
// ==========================================
function saveCurrentPlan() {
  const dest = getCurrentDest();
  const saved = JSON.parse(localStorage.getItem('voyage_saved_plans') || '[]');
  const entry = {
    id: 'plan-' + Date.now(),
    savedAt: new Date().toLocaleString('ja-JP'),
    title: `${dest.emoji} ${dest.name}（${state.nights === 0 ? '日帰り' : state.nights + '泊' + (state.nights + 1) + '日'}）`,
    totalText: document.getElementById('sumTotalAmount').textContent,
    stateSnapshot: JSON.parse(JSON.stringify(state))
  };
  saved.unshift(entry);
  localStorage.setItem('voyage_saved_plans', JSON.stringify(saved.slice(0, 20)));
  showToast('💾 現在の旅行プランを保存しました！');
}

function openSavedModal() {
  const saved = JSON.parse(localStorage.getItem('voyage_saved_plans') || '[]');
  const box = document.getElementById('savedPlansContainer');
  if (saved.length === 0) {
    box.innerHTML = `<p style="color:var(--text-sub);font-size:13.5px;padding:16px 0;">まだ保存されたプランはありません。右上の「💾 保存」ボタンからいつでも保存できます。</p>`;
  } else {
    box.innerHTML = saved.map(item => `
      <div style="border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;">
        <div>
          <div style="font-weight:800;font-size:15px;">${item.title}</div>
          <div style="font-size:12px;color:var(--text-sub);">保存日時: ${item.savedAt} ｜ 概算合計: <strong>${item.totalText}</strong></div>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn-outline" onclick="loadSavedPlan('${item.id}')">読み込む</button>
          <button class="btn-outline" style="color:var(--rose);" onclick="deleteSavedPlan('${item.id}')">削除</button>
        </div>
      </div>
    `).join('');
  }
  document.getElementById('savedModal').classList.add('open');
}

function closeSavedModal() {
  document.getElementById('savedModal').classList.remove('open');
}

function loadSavedPlan(planId) {
  const saved = JSON.parse(localStorage.getItem('voyage_saved_plans') || '[]');
  const found = saved.find(p => p.id === planId);
  if (!found) return;
  state = { ...found.stateSnapshot };
  document.getElementById('originSelect').value = state.origin;
  document.getElementById('departDate').value = state.departDate;
  document.getElementById('nightsSelect').value = String(state.nights);
  document.getElementById('adultsSelect').value = String(state.adults);
  document.getElementById('styleSelect').value = state.style;
  closeSavedModal();
  updateSummary();
  goToStep(state.currentStep || 5);
  showToast('📂 保存済みプランを読み込みました');
}

function deleteSavedPlan(planId) {
  const saved = JSON.parse(localStorage.getItem('voyage_saved_plans') || '[]').filter(p => p.id !== planId);
  localStorage.setItem('voyage_saved_plans', JSON.stringify(saved));
  openSavedModal();
}

function copyShareText() {
  const dest = getCurrentDest();
  const transport = dest.transports.find(t => t.id === state.selectedTransportId) || dest.transports[0];
  const hotel = dest.hotels.find(h => h.id === state.selectedHotelId) || dest.hotels[0];
  const lines = [
    `【${dest.emoji} ${dest.name} 旅行プラン】`,
    `📅 日程: ${state.departDate || '未定'} から ${state.nights === 0 ? '日帰り' : state.nights + '泊' + (state.nights + 1) + '日'}（大人${state.adults}名）`,
    `🚄 交通: ${transport.name}（${state.origin}発）`,
    `🏨 宿泊: ${state.nights === 0 ? '日帰り' : hotel.name + '（' + hotel.meal + '）'}`,
    `🗺️ 観光スポット:`,
    ...state.selectedSpots.map(s => `  ・[Day${s.day || 1} ${s.time || ''}] ${s.name}`),
    `💰 概算予算: 全員合計 ${document.getElementById('sumTotalAmount').textContent}（1名あたり ${document.getElementById('sumPerPersonAmount').textContent}）`
  ];
  const text = lines.join('\n');
  const done = () => showToast('📋 旅行プランをコピーしました！LINEに貼り付けてください');
  const fail = () => { if (__copyFallback(text)) done(); else { window.prompt('下の文章を長押ししてコピーしてください', text); } };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fail); else fail();
}

function showToast(msg) {
  const t = document.getElementById('toastMsg');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

// ==========================================
// Boot
// ==========================================
initDefaultDate();
selectDestination('kyoto', false);
